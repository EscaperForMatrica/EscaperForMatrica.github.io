<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALADA — бытовая химия напрямую с завода</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f9fa; color: #2d3748; font: 16px/1.5 Arial, sans-serif; }
  .box { background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,11,48,.08); padding: 40px; max-width: 420px; margin: 16px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(21,174,169,.2); border-top-color: #15aea9; animation: s .8s linear infinite; }
  .muted { color: #64748b; font-size: 14px; }
  a { color: #0e7c78; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <span class="logo"><img src="/images/logo.png" alt="" width="24" height="21">PALADA</span>
  <div class="spin" id="spin"></div>
  <p id="msg">Открываем магазин…</p>
  <p class="muted" id="note">Демо-версия работает прямо в вашем браузере: корзина, заказы и кабинет сохраняются на этом устройстве.</p>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  function fail(text) {
    document.getElementById('spin').style.display = 'none';
    msg.innerHTML = text;
  }
  if (!('serviceWorker' in navigator) || !window.indexedDB) {
    fail('Браузер не поддерживает нужные технологии (Service Worker). Откройте сайт в свежем Chrome, Safari, Edge или Firefox — не в приватном режиме.');
    return;
  }
  // Защита от зацикливания перезагрузок
  var tries = Number(sessionStorage.getItem('palada-boot') || 0);
  if (tries > 2) {
    sessionStorage.removeItem('palada-boot');
    fail('Не получилось запустить магазин. <a href="' + location.href + '">Попробовать ещё раз</a>');
    return;
  }
  function go() {
    sessionStorage.setItem('palada-boot', String(tries + 1));
    location.reload();
  }
  navigator.serviceWorker.register('/sw.js').then(function () {
    return navigator.serviceWorker.ready;
  }).then(function () {
    if (navigator.serviceWorker.controller) go();
    else navigator.serviceWorker.addEventListener('controllerchange', go);
  }).catch(function (e) {
    fail('Не получилось запустить магазин: ' + (e && e.message ? e.message : e));
  });
})();
</script>
</body>
</html>
